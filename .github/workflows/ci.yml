name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Unit and contract tests
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # Vercel deploys the native Next.js application, not the OpenNext Worker output.
      # Keep this check separate so Vercel compatibility is verified directly in CI.
      - name: Native Next.js production build (Vercel runtime)
        run: pnpm build

      # Retain the legacy Cloudflare deployment build as a separate compatibility check.
      - name: Cloudflare Worker build
        run: pnpm build:worker

      # Keep the existing portable Node container proof available for comparison.
      - name: Cloud Run container build
        run: docker build --tag brilina-forge-ai:ci .

      - name: Commit refreshed lockfile on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh pnpm lockfile"
          git push
